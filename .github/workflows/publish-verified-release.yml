name: Publish the verified 0.6.2 release

# Only the owner creates this branch, at the exact commit that passed acceptance.
# A dispatch button, tag creation, or update to main cannot run the publish job.
# The create event explicitly covers branches created through the Git refs API.
on:
  create:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-verified-v0.6.2
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.ref_type == 'branch' && github.ref == 'refs/heads/release/validated-0.6.2' }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Find the successful acceptance run for this exact commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const branch = 'fix/workspace-privacy-0.6.2';
            const path = '.github/workflows/desktop-acceptance.yml';
            const candidates = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'desktop-acceptance.yml',
              branch, head_sha: context.sha, status: 'success', per_page: 100,
            });
            const matching = candidates.filter(run => run.head_sha === context.sha &&
              run.head_branch === branch && run.status === 'completed' && run.conclusion === 'success');
            if (!matching.length) throw new Error('No successful acceptance run exists for this commit and branch.');
            const chosen = matching.sort((a, b) => b.id - a.id)[0];
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: chosen.id});
            const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: run.workflow_id});
            if (workflow.path !== path || run.head_sha !== context.sha || run.head_branch !== branch ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                run.repository?.full_name !== repository || run.head_repository?.id !== context.payload.repository.id) {
              throw new Error('The acceptance workflow/run provenance changed or belongs to another repository.');
            }
            const available = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const artifacts = [];
            for (const prefix of ['acceptance-evidence', 'verified-candidate']) {
              const name = `${prefix}-${context.sha}`;
              const found = available.filter(item => item.name === name);
              if (found.length !== 1) throw new Error(`Expected exactly one artifact: ${name}`);
              const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: found[0].id});
              if (artifact.expired || artifact.workflow_run?.id !== run.id ||
                  artifact.workflow_run?.head_sha !== context.sha || !/^sha256:[a-f0-9]{64}$/.test(artifact.digest || '')) {
                throw new Error(`Artifact provenance or digest is missing: ${name}`);
              }
              artifacts.push(artifact);
            }
            await fs.mkdir('.ci-release', {recursive: true});
            await fs.writeFile('.ci-release/github-provenance.json', JSON.stringify({
              schema_version: 1, repository, repository_id: context.payload.repository.id,
              workflow, run, artifacts,
            }, null, 2) + '\n', 'utf8');
            core.setOutput('run_id', String(run.id));

      - name: Download the original artifact bytes without text conversion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path('.ci-release')
          provenance = json.loads((directory / 'github-provenance.json').read_text('utf-8'))
          for artifact in provenance['artifacts']:
              prefix = 'acceptance-evidence' if artifact['name'].startswith('acceptance-evidence-') else 'verified-candidate'
              endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{int(artifact['id'])}/zip"
              with (directory / (prefix + '.zip')).open('xb') as output:
                  subprocess.run(['gh', 'api', endpoint], stdout=output, check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }

      - name: Recheck source, complete acceptance evidence and exact candidate files
        env:
          ACCEPTANCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: pwsh
        run: |
          python scripts/prepare_verified_release.py prepare --metadata .ci-release/github-provenance.json --evidence-archive .ci-release/acceptance-evidence.zip --candidate-archive .ci-release/verified-candidate.zip --output .ci-release/prepared --repository "$env:GITHUB_REPOSITORY" --expected-commit "$env:GITHUB_SHA" --expected-run-id "$env:ACCEPTANCE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation rejected the candidate.' }

      - name: Install locked packaging and desktop dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification dependency installation failed.' }

      - name: Extract only the fully accepted Windows toolkit
        shell: pwsh
        run: |
          python packaging/build_windows_full.py extract --archive .ci-release/prepared/candidates/Figure_Workbench_0.6.2_Windows_Full.zip --build-record .ci-release/prepared/evidence/windows-build.json --destination .ci-release/installer-payload --receipt .ci-release/installer-extraction.json
          if ($LASTEXITCODE -ne 0) { throw 'Verified full toolkit extraction failed.' }

      - name: Fetch and authenticate the official WebView2 bootstrapper
        shell: pwsh
        run: |
          python packaging/fetch_webview2_bootstrapper.py --output .ci-release/webview/MicrosoftEdgeWebview2Setup.exe --record .ci-release/webview/bootstrapper.json
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft WebView2 bootstrapper verification failed.' }

      - name: Package the complete accepted payload into one installer
        shell: pwsh
        run: |
          python packaging/build_windows_installer.py --toolkit .ci-release/installer-payload/Figure_Workbench_0.6.2_Windows_x64 --webview-bootstrapper .ci-release/webview/MicrosoftEdgeWebview2Setup.exe --webview-record .ci-release/webview/bootstrapper.json --output .ci-release/installer/Figure_Workbench_0.6.2_Setup.exe --record .ci-release/installer-build.json --expected-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }

      - name: Verify actual installation, reinstall, project retention and uninstall
        shell: pwsh
        run: |
          python scripts/check_windows_installer.py --installer .ci-release/installer/Figure_Workbench_0.6.2_Setup.exe --build-record .ci-release/installer-build.json --output .ci-release/installer-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer lifecycle verification failed.' }

      - name: Prepare the single public installer with the unchanged formal release gate
        shell: pwsh
        run: |
          python scripts/prepare_installer_release.py prepare --installer .ci-release/installer/Figure_Workbench_0.6.2_Setup.exe --build-record .ci-release/installer-build.json --smoke-record .ci-release/installer-smoke.json --output .ci-release/installer-prepared --repository "$env:GITHUB_REPOSITORY" --expected-commit "$env:GITHUB_SHA" --tag v0.6.2 --verified-release-directory .ci-release/prepared
          if ($LASTEXITCODE -ne 0) { throw 'Single-installer release preparation rejected the candidate.' }

      - name: Refuse any existing tag or release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            if (releases.some(release => release.tag_name === 'v0.6.2'))
              throw new Error('A release or draft for v0.6.2 already exists. It will never be overwritten.');
            let existing;
            try { existing = await github.rest.git.getRef({...context.repo, ref: 'tags/v0.6.2'}); }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing) throw new Error('The v0.6.2 tag already exists. It will never be overwritten.');

      - name: Create an unpublished draft with only the verified Setup.exe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -Encoding UTF8 .ci-release/installer-prepared/upload-manifest.json | ConvertFrom-Json
          $assets = @($manifest.assets | ForEach-Object { Join-Path .ci-release/installer-prepared $_.path })
          gh release create v0.6.2 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --title "Figure Workbench 0.6.2 · Windows 安装版" --notes-file .ci-release/installer-prepared/RELEASE_NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation/upload failed; no existing release will be replaced.' }

      - name: Fetch uploaded attachment digests and the draft tag state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const drafts = releases.filter(release => release.tag_name === 'v0.6.2');
            if (drafts.length !== 1) throw new Error('Expected exactly one new draft release.');
            let release;
            for (let attempt = 0; attempt < 6; attempt++) {
              ({data: release} = await github.rest.repos.getRelease({...context.repo, release_id: drafts[0].id}));
              if (release.assets?.length === 1 && release.assets.every(asset =>
                  asset.state === 'uploaded' && /^sha256:[a-f0-9]{64}$/.test(asset.digest || ''))) break;
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            let tag;
            try { ({data: tag} = await github.rest.git.getRef({...context.repo, ref: 'tags/v0.6.2'})); }
            catch (error) {
              if (error.status !== 404) throw error;
              tag = {status: 404, exists: false, repository: `${context.repo.owner}/${context.repo.repo}`, ref: 'refs/tags/v0.6.2'};
            }
            await fs.writeFile('.ci-release/remote-release.json', JSON.stringify(release, null, 2) + '\n', 'utf8');
            await fs.writeFile('.ci-release/remote-tag.json', JSON.stringify(tag, null, 2) + '\n', 'utf8');

      - name: Require exact remote names, sizes, digests and target commit
        shell: pwsh
        run: |
          python scripts/prepare_installer_release.py verify-upload --prepared .ci-release/installer-prepared --release-json .ci-release/remote-release.json --tag-json .ci-release/remote-tag.json --repository "$env:GITHUB_REPOSITORY" --expected-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded attachment verification failed; release remains a draft.' }

      - name: Publish the verified draft as latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release edit v0.6.2 --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication did not complete.' }
          "Verified release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v0.6.2" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify the published release target
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: 'v0.6.2'});
            const {data: tag} = await github.rest.git.getRef({...context.repo, ref: 'tags/v0.6.2'});
            const manifest = JSON.parse(await fs.readFile('.ci-release/installer-prepared/upload-manifest.json', 'utf8'));
            const expected = manifest.assets[0];
            if (release.draft || release.prerelease || release.target_commitish !== context.sha ||
                tag.object?.type !== 'commit' || tag.object?.sha !== context.sha)
              throw new Error('Published release target does not match the verified commit.');
            if (release.assets?.length !== 1 || release.assets[0].name !== expected.file ||
                release.assets[0].state !== 'uploaded' || release.assets[0].size !== expected.bytes ||
                release.assets[0].digest !== `sha256:${expected.sha256}`)
              throw new Error('Published release does not contain exactly the verified Setup.exe.');
            await fs.writeFile('.ci-release/published-release.json', JSON.stringify({release, tag}, null, 2) + '\n', 'utf8');

      - name: Retain all original packages, acceptance evidence and installer receipts internally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipts-${{ github.sha }}-${{ github.run_id }}
          path: |
            .ci-release/github-provenance.json
            .ci-release/remote-release.json
            .ci-release/remote-tag.json
            .ci-release/published-release.json
            .ci-release/prepared/
            .ci-release/installer-prepared/
            .ci-release/installer-extraction.json
            .ci-release/installer-build.json
            .ci-release/installer-build.compiler.log
            .ci-release/installer-smoke.json
            .ci-release/installer-smoke.*.log
            .ci-release/webview/bootstrapper.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
