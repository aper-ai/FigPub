name: Complete toolkit and scientific workflow acceptance

on:
  push:
    branches: [fix/interaction-lifecycle-0.6.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interaction-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      FW_BROWSER_RESULTS: test-results/interaction-preflight
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked interaction test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          python -m playwright install chromium
      - name: Verify delayed submission, task recovery, cancellation and keyboard behavior
        run: python tests/browser_task_lifecycle.py
      - name: Retain interaction preflight evidence before complete package assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-preflight-${{ github.sha }}
          path: test-results/interaction-preflight/
          if-no-files-found: error
          retention-days: 30

  windows-acceptance:
    needs: interaction-acceptance
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-desktop.txt
          python -m pip install ziglang==0.15.2
          npm ci
          python -m playwright install chromium
      - name: Prepare official isolated Cellpose CPU inference
        run: python scripts/prepare_cellpose_acceptance.py --output .ci-cellpose --record test-results/model-environment.json
      - name: Python numerical, persistence and service regressions
        run: python scripts/check_python.py --output test-results
      - name: Retain numerical evidence before longer UI acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-evidence-${{ github.sha }}
          path: |
            test-results/python.xml
            test-results/python-checks.json
            test-results/model-environment.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fetch the verified previous runtime
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-runtime-0.4.0 --repo "${{ github.repository }}" --pattern Figure_Workbench_0.4.0_Windows_Main.zip --dir .ci-input
      - name: Build the portable CPU component from the tested environment
        if: ${{ !cancelled() }}
        run: python packaging/build_cellpose_candidate.py --base-main .ci-input/Figure_Workbench_0.4.0_Windows_Main.zip --environment .ci-cellpose --output dist/Figure_Workbench_0.6.1_Cellpose_CPU_Windows_x64 --record test-results/portable-cellpose-build.json
      - name: Frontend lint and DOM/service regressions
        if: ${{ !cancelled() }}
        run: python scripts/check_frontend.py --output test-results
      - name: Build standalone browser candidate
        if: ${{ !cancelled() }}
        run: npm run build:browser
      - name: Build the complete Windows toolkit with its isolated CPU models
        if: ${{ !cancelled() }}
        run: |
          python packaging/fetch_desktop_dependencies.py --output .ci-desktop-wheels
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency preparation failed.' }
          $zigPath = python -c "import ziglang; from pathlib import Path; print(Path(ziglang.__file__).parent / 'zig.exe')"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned launcher compiler is unavailable.' }
          python packaging/build_desktop_launcher.py --zig "$zigPath" --output .ci-input/FigureWorkbench.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher compilation failed.' }
          python packaging/build_windows_full.py build --base-main .ci-input/Figure_Workbench_0.4.0_Windows_Main.zip --launcher .ci-input/FigureWorkbench.exe --desktop-wheels .ci-desktop-wheels --component dist/Figure_Workbench_0.6.1_Cellpose_CPU_Windows_x64 --component-record test-results/portable-cellpose-build.json --output dist/Figure_Workbench_0.6.1_Windows_x64 --record test-results/windows-build.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete toolkit assembly failed.' }
      - name: Extract the actual final ZIP into a fresh installation directory
        if: ${{ !cancelled() }}
        run: python packaging/build_windows_full.py extract --archive dist/Figure_Workbench_0.6.1_Windows_Full.zip --build-record test-results/windows-build.json --destination "dist/完整工具包 验收" --receipt test-results/full-toolkit-extraction.json
      - name: Execute both models using the interpreter from the final complete ZIP
        if: ${{ !cancelled() }}
        run: python scripts/check_portable_cellpose.py --component "dist/完整工具包 验收/Figure_Workbench_0.6.1_Windows_x64" --toolkit-archive dist/Figure_Workbench_0.6.1_Windows_Full.zip --extraction-record test-results/full-toolkit-extraction.json --output test-results
      - name: Complete real browser workflow matrix
        if: ${{ !cancelled() }}
        run: python scripts/run_acceptance.py --output test-results/acceptance
      - name: Retain browser and complete-toolkit evidence before native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evidence-${{ github.sha }}
          path: |
            test-results/acceptance/
            test-results/portable*.json
            test-results/portable*.xml
            test-results/portable*.log
            test-results/frontend-checks.json
            test-results/node.xml
            test-results/node.stderr.log
            test-results/lint.log
            test-results/windows-build.json
            test-results/full-toolkit-extraction.json
          if-no-files-found: warn
          retention-days: 30
      - name: Native Windows client acceptance
        if: ${{ !cancelled() }}
        run: python tests/desktop_windows_smoke.py --app-dir "dist/完整工具包 验收/Figure_Workbench_0.6.1_Windows_x64" --toolkit-archive dist/Figure_Workbench_0.6.1_Windows_Full.zip --extraction-record test-results/full-toolkit-extraction.json --output test-results/desktop
      - name: Verify the release gate
        if: ${{ !cancelled() }}
        run: python scripts/release_gate.py --reports test-results --expected-commit "${{ github.sha }}"
      - name: Retain compact browser and native visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.sha }}
          path: |
            test-results/acceptance/**/*.png
            test-results/acceptance/**/*.json
            test-results/desktop/*.png
            test-results/desktop/native-acceptance.json
            test-results/release-gate.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain all test evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Retain verified candidate packages without publishing a release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-${{ github.sha }}
          path: |
            dist/Figure_Workbench_0.6.1_Windows_Full.zip
            dist/Figure_Workbench_0.6.1_Source.zip
            dist/Figure_Workbench_0.6.1_Browser.html
          if-no-files-found: error
          retention-days: 30
